<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:site_name" content="Rigs" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@userigsfun" />
  <meta name="twitter:title" content="Launch · Rigs" />
  <meta name="twitter:description" content="Launch a coin on Pons V2 in one signature and keep 80% of its creator fees." />
  <meta name="twitter:image" content="https://userigs.fun/assets/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#05070c" />
  <script>try{var t=localStorage.getItem("rigs-theme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body data-nav="launch">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="app-main">

      <div class="app-head">
        <div><p class="kicker">Launch</p><h1>Launch a coin</h1>
        <p class="lede muted">Pick a chain. Your wallet signs, you are the creator, and 80% of the creator fees are yours.</p></div>
        <span class="badge gray" id="netState">Reading chain…</span>
      </div>
      <div class="chain-pick" id="chainPick" role="tablist" aria-label="Chain">
        <button class="on" data-chain="robinhood" role="tab"><img src="/assets/robinhood.png" alt="" /><span><b>Robinhood Chain</b><small>Pons V2 curve or a hooked v4 pool</small></span></button>
        <button data-chain="solana" role="tab"><img src="/assets/solana.jpg" alt="" /><span><b>Solana</b><small><img class="via-ic" src="/assets/pumpfun.jpg" alt="" />pump.fun, 80/20 fee sharing</small></span></button>
        <button data-chain="arc" role="tab"><img src="/assets/arc.jpg" alt="" /><span><b>Arc</b><small><img class="via-ic" src="/assets/argus.jpg" alt="" />ArgusPad, fees in USDC</small></span></button>
      </div>
      <section id="solLaunch" hidden></section>
      <section id="arcLaunch" hidden></section>
      <div id="evmLaunch">
      <div class="stepbar" id="stepbar">
        <button class="sb-btn" id="sbPrev" aria-label="Previous step">‹</button>
        <div class="sb-mid"><b id="sbCount">Step 1 of 5</b><span id="sbName">Intent</span></div>
        <button class="sb-btn" id="sbNext" aria-label="Next step">›</button>
        <button class="sb-btn" id="sbReset" aria-label="Reset draft" title="Reset draft">↺</button>
      </div>
      <div id="result"></div>
      <div class="wiz-grid">
        <ol class="wiz-rail" id="wizSteps"></ol>
        <section class="card wiz-body" id="stepBody"></section>
        <aside class="stack wiz-side">
          <div class="card pad"><p class="form-h">Live compatibility</p><ul class="compat" id="compat"></ul></div>
          <div class="card pad"><p class="form-h">Draft</p><dl class="draft" id="draft"></dl><button class="btn btn-dark btn-xs" id="discard">Discard draft</button></div>
        </aside>
      </div>
      </div>

    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="shell.js"></script>
  <script type="module" src="launch.js"></script>
  <script type="module" src="sol-launch.js"></script>
  <script type="module" src="arc-launch.js"></script>
</body>
</html>

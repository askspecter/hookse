<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launch · Hookse</title>
  <meta name="description" content="Launch on Hookse" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23fc72ff'/><path d='M11 7v11a5 5 0 0 0 10 0v-3' stroke='%230b0d12' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>" />
  <script>try{var t=localStorage.getItem("hookse-theme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body data-nav="launch">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="app-main">

      <div class="app-head">
        <div><p class="kicker">Market launcher · Robinhood Chain</p><h1>Launch a market</h1>
        <p class="lede muted">Five steps: intent, hook, details, price and fees, then review and sign. Your draft is saved in this browser at every step.</p></div>
        <span class="badge gray" id="netState">Reading chain…</span>
      </div>
      <div class="stepbar" id="stepbar">
        <button class="sb-btn" id="sbPrev" aria-label="Previous step">‹</button>
        <div class="sb-mid"><b id="sbCount">Step 1 of 5</b><span id="sbName">Intent</span></div>
        <button class="sb-btn" id="sbNext" aria-label="Next step">›</button>
        <button class="sb-btn" id="sbReset" aria-label="Reset draft" title="Reset draft">↺</button>
      </div>
      <ol class="stepper wiz-steps" id="wizSteps"></ol>
      <div id="result"></div>
      <div class="wiz-grid">
        <section class="card wiz-body" id="stepBody"></section>
        <aside class="stack wiz-side">
          <div class="card pad"><p class="form-h">Live compatibility</p><ul class="compat" id="compat"></ul></div>
          <div class="card pad"><p class="form-h">Draft</p><dl class="draft" id="draft"></dl><button class="btn btn-dark btn-xs" id="discard">Discard draft</button></div>
        </aside>
      </div>

    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="shell.js"></script>
  <script type="module" src="launch.js"></script>
</body>
</html>

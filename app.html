<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coins · Rigs</title>
  <meta name="description" content="Every coin launched through Rigs on Robinhood Chain" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#05070c" />
  <script>try{var t=localStorage.getItem("rigs-theme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body data-nav="app">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="app-main">
      <div class="app-head">
        <div><p class="kicker">Robinhood Chain · live</p><h1>Coins</h1>
        <p class="lede muted">Every coin launched through Rigs: on a Pons V2 curve or straight into a hooked v4 pool.</p></div>
        <a href="/launch" class="btn btn-primary btn-sm">+ Launch a coin</a>
      </div>
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="active" data-tab="all">All</button>
          <button data-tab="curve">On curve</button>
          <button data-tab="pools">v4 pools</button>
          <button data-tab="auctions">Auctions</button>
        </div>
        <div class="toolbar-r">
          <input id="filter" class="filter" placeholder="Name, ticker or 0x…" />
          <select id="sort" class="filter sel" aria-label="Sort"><option value="new">Newest</option><option value="earned">Creator earned</option></select>
          <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">↻</button>
        </div>
      </div>
      <p class="status mono" id="updated">Reading…</p>
      <div class="coin-grid" id="grid"><div class="rail-empty">Reading the chain…</div></div>
      <div class="more-row"><button class="btn btn-ghost btn-sm" id="more" hidden>Show more</button></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="shell.js"></script>
  <script type="module" src="discover.js"></script>
</body>
</html>

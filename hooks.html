<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hooks · Rigs</title>
  <meta name="description" content="Hooks on Rigs" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23fc72ff'/><path d='M11 7v11a5 5 0 0 0 10 0v-3' stroke='%230b0d12' stroke-width='3.2' fill='none' stroke-linecap='round'/></svg>" />
  <script>try{var t=localStorage.getItem("rigs-theme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body data-nav="hooks">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="app-main">

      <div class="app-head">
        <div><p class="kicker">Catalog</p><h1>Hooks</h1>
        <p class="lede muted">Every rule a Rigs pool can run, how it behaves and what it costs. Pick blocks here, then combine them in the Builder.</p></div>
        <div class="btn-row"><a href="/scan" class="btn btn-dark btn-sm">List a hook</a><a href="/builder" class="btn btn-pink btn-sm">Open the builder</a></div>
      </div>
      <div class="feat-row" id="featured"></div>
      <div class="disc-bar sec-h">
        <div class="tabs" id="htabs">
          <button class="active" data-f="all">All</button><button data-f="native">Native blocks</button><button data-f="community">Community</button><button data-f="roots">Roots</button>
        </div>
        <input id="hsearch" class="filter" placeholder="Search hooks…" />
        <select id="hsort" class="filter sel push"><option value="gas">Lowest gas</option><option value="name">Name</option></select>
        <span class="status mono" id="hcount"></span>
      </div>
      <div class="grid3" id="listing"></div>
      <div class="card idea"><p><b>Have a hook idea?</b> <span class="muted">Tell us what it should do. Submitting does not list or deploy anything.</span></p><a class="btn btn-dark btn-sm" href="/community#ideas">Submit an idea</a></div>

    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="shell.js"></script>
  <script type="module" src="hooks.js"></script>
</body>
</html>

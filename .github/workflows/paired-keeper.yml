# Runs the paired-coin keeper (keeper/) every 30 minutes, so no server is needed.
# It harvests creator fees, buys NFT floors or Collector Crypt gacha packs, runs raffles and
# delivers prizes. Contract addresses come from config.js (paired block); until they are set the
# run does nothing.
#
# Setup (github.com → Settings → Secrets and variables → Actions):
#   Secrets:   KEEPER_PRIVATE_KEY        keeper EVM wallet (must equal Registry.keeper), gas money only
#              KEEPER_SOLANA_KEY         keeper Solana wallet, base58 (pays for packs, delivers cards)
#              COLLECTOR_CRYPT_API_KEY   partner key from Collector Crypt
#              OPENSEA_API_KEY           optional; empty = auto free-tier key
#              SOLANA_RPC                optional; a private Solana RPC URL
#   Variables (optional): MAX_CEILING_ETH, CEILING_MARKUP_BPS, MIN_HARVEST_ETH
#
# Raffle snapshots, pull receipts and the live machine list are committed to snapshots/,
# which Vercel serves with the site.
name: paired-keeper

on:
  schedule:
    - cron: "*/30 * * * *" # GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulate only (send no transactions)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paired-keeper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci

      - name: Run one keeper pass
        working-directory: keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          KEEPER_SOLANA_KEY: ${{ secrets.KEEPER_SOLANA_KEY }}
          COLLECTOR_CRYPT_API_KEY: ${{ secrets.COLLECTOR_CRYPT_API_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          MAX_CEILING_ETH: ${{ vars.MAX_CEILING_ETH || '0.5' }}
          CEILING_MARKUP_BPS: ${{ vars.CEILING_MARKUP_BPS || '300' }}
          MIN_HARVEST_ETH: ${{ vars.MIN_HARVEST_ETH || '0.005' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SNAPSHOT_DIR: ../snapshots
        run: |
          if [ -z "$KEEPER_PRIVATE_KEY" ]; then echo "KEEPER_PRIVATE_KEY secret not set; skipping"; exit 0; fi
          node src/index.js --once

      - name: Publish snapshots
        run: |
          if [ -n "$(git status --porcelain snapshots)" ]; then
            git config user.name "rigs-keeper"
            git config user.email "keeper@users.noreply.github.com"
            git add snapshots
            git commit -m "keeper: publish raffle snapshots and pulls [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coin · Rigs</title>
  <meta name="description" content="Trade this coin on Rigs: live price, chart, rules and recent trades on Robinhood Chain." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Rigs" />
  <meta property="og:title" content="Coin · Rigs" />
  <meta property="og:description" content="Trade this coin on Rigs: live price, chart, rules and recent trades on Robinhood Chain." />
  <meta property="og:image" content="https://userigs.fun/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Rigs: composable markets, built with hooks. Launch on Pons V2 and keep 80% of every creator fee." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@userigsfun" />
  <meta name="twitter:title" content="Coin · Rigs" />
  <meta name="twitter:description" content="Trade this coin on Rigs: live price, chart, rules and recent trades on Robinhood Chain." />
  <meta name="twitter:image" content="https://userigs.fun/assets/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#05070c" />
  <script>try{var t=localStorage.getItem("rigs-theme");if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>
<body data-nav="app">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="app-main">

      <p class="crumb"><a href="/app">Coins</a> / <span>Coin</span> <span class="push-r mono dim" id="asOf"></span></p>
      <div id="coinHead" class="coin-head"><div class="empty"><b>Reading…</b></div></div>
      <div class="coin-layout">
        <div class="coin-main">
          <section class="card coin-stats" id="stats"></section>
          <div class="subtabs sec-gap" id="ctabs"><button class="on" data-ctab="price">Price</button><button data-ctab="rules">Rules</button><button data-ctab="activity">Activity</button><button data-ctab="details">Details</button></div>
          <section data-cpanel="price" class="card pad" id="pricePanel"></section>
          <section data-cpanel="rules" class="card pad" id="rulesPanel" hidden></section>
          <section data-cpanel="activity" class="card table-card" id="activityPanel" hidden></section>
          <section data-cpanel="details" class="card pad" id="detailsPanel" hidden></section>
          <section class="card creator-box" id="creatorBox" hidden></section>
          <section class="card winnings-box" id="winBox" hidden></section>
        </div>
        <aside class="coin-side">
          <section class="card trade" id="trade"></section>
          <nav class="coin-actions">
            <a href="#" id="extLink" target="_blank" rel="noopener">Explorer ↗</a>
            <button data-ctab="activity">Activity</button>
            <a href="/launch">Launch a coin</a>
          </nav>
        </aside>
      </div>
      <a class="btn btn-primary m-trade" href="#trade">Buy / sell</a>

    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="shell.js"></script>
  <script type="module" src="coin.js"></script>
</body>
</html>
